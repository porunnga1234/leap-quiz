<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b5bfd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LEAP単語">
<meta name="format-detection" content="telephone=no">
<title>LEAP 単語クイズ</title>
<style>
:root{
  --bg:#f4f6fb;--card:#ffffff;--ink:#161b26;--sub:#6b7280;--line:#e5e8f0;
  --acc:#3b5bfd;--chip:#eef1f8;--ok:#0f9d58;--ok-bg:#e9f7ef;--ng:#e5484d;--ng-bg:#fdecec;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 26px -16px rgba(16,24,40,.25);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0e1117;--card:#161b25;--ink:#e8edf7;--sub:#97a1b2;--line:#262e3d;--chip:#1d2431;
  --ok-bg:#12291d;--ng-bg:#2b1518;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -16px rgba(0,0,0,.8);}
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:16px;line-height:1.6;overscroll-behavior-y:contain}
[hidden]{display:none !important}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation}
input{font:inherit;color:inherit}
input:focus{outline:none}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.typewrap input:focus,.typewrap input:focus-visible{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(59,91,253,.16)}
b{font-weight:700}
.wrap{max-width:780px;margin:0 auto;padding:0 14px 110px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px;position:sticky;top:0;background:var(--bg);z-index:20}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--acc),#7c5cfc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none;box-shadow:0 6px 16px -8px var(--acc)}
.brand .t{font-weight:700;font-size:15px;line-height:1.2}
.brand .s{font-size:11px;color:var(--sub);line-height:1.3}
.toprate{font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line);padding:6px 11px;border-radius:999px;white-space:nowrap;flex:none}

.hero{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin:0 0 12px;box-shadow:var(--shadow)}
.hero-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--sub);font-weight:700}
.hero-top b{font-size:24px;color:var(--ink);line-height:1}
.hero-sub{font-size:12px;color:var(--sub);margin-top:7px}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#7c5cfc);border-radius:99px;transition:width .3s}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.ch{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.04em;margin:0 0 10px}
.note{font-size:12px;color:var(--sub);margin:8px 0 0;line-height:1.55}
.center{text-align:center}

.seg{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:12px}
.seg button{flex:1;padding:10px 5px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--sub);transition:background .15s,color .15s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.col{flex-direction:column;gap:2px;padding:4px}
.seg.col button{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:12px;font-size:14px}
.seg.col button .cnt{font-size:12px;color:var(--sub);font-weight:600;flex:none;margin-left:8px}
.seg.col button.on .cnt{color:var(--acc)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{background:var(--chip);border:1px solid transparent;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600}
.chips button.on{background:var(--acc);color:#fff}

.rangerow{display:flex;align-items:center;gap:8px;margin-top:8px}
.rangerow input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 10px;font-size:16px;font-weight:600;text-align:center}
.tilde{color:var(--sub);font-weight:700}
.mini{background:var(--chip);border-radius:10px;padding:11px 14px;font-size:13px;font-weight:700;white-space:nowrap;flex:none}

.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;font-size:14px;position:relative;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch i{width:46px;height:27px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:none}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked + i{background:var(--acc)}
.switch input:checked + i::after{transform:translateX(19px)}

.primary{background:var(--acc);color:#fff;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;width:100%;box-shadow:0 10px 22px -12px var(--acc)}
.primary:active{transform:translateY(1px)}
.primary.big{padding:17px;font-size:17px;border-radius:16px;margin-top:2px}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;font-weight:600;width:100%}
.ghost.small{padding:8px 12px;width:auto;font-size:13px;border-radius:10px}
.ghost.danger{color:var(--ng);border-color:rgba(229,72,77,.35)}
.block{display:block;width:100%}
.start-top{display:none}

.quiztop{display:flex;gap:10px;align-items:center;margin:4px 0 12px}
.icon{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:15px;display:grid;place-items:center;flex:none}
.progress{flex:1;min-width:0}
.ptext{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px;font-weight:700}

.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px 16px;box-shadow:var(--shadow)}
.qmeta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);font-weight:700}
.badge{background:var(--chip);border-radius:999px;padding:4px 11px;color:var(--ink)}
.badge.hi{background:rgba(59,91,253,.14);color:var(--acc)}
.qno{margin-left:auto}
.spk{width:32px;height:32px;border-radius:50%;background:var(--chip);font-size:15px;display:grid;place-items:center;flex:none}
.prompt{margin:16px 0 4px;text-align:center}
.eword{font-size:clamp(30px,9vw,44px);font-weight:800;letter-spacing:-.01em;word-break:break-word;line-height:1.15}
.jmeaning{font-size:clamp(19px,5.2vw,25px);font-weight:700;line-height:1.45}

.opts{display:grid;gap:9px;margin-top:16px}
.opt{display:flex;gap:9px;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px;line-height:1.45;transition:background .15s,border-color .15s}
.opt .otx{flex:1;min-width:0}
.opt .num{font-size:11px;color:var(--sub);font-weight:700;min-width:14px;padding-top:2px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--ng-bg);border-color:var(--ng)}
.opt:disabled{opacity:1}

.typewrap{display:flex;gap:8px;margin-top:16px}
.typewrap input{flex:1;min-width:0;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:17px;font-weight:600}
.typewrap input.ok{border-color:var(--ok);background:var(--ok-bg)}
.typewrap input.bad{border-color:var(--ng);background:var(--ng-bg)}
.typewrap .primary{width:auto;padding:14px 18px;flex:none}
.hintrow{display:flex;align-items:center;gap:10px;margin-top:10px;min-height:20px}

.qactions{margin-top:12px}

.fb{margin-top:14px;border-radius:18px;padding:16px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.fb.ok{border-color:rgba(15,157,88,.5)}
.fb.ng{border-color:rgba(229,72,77,.5)}
.fbhead{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;margin-bottom:10px}
.fb.ok .fbhead{color:var(--ok)}
.fb.ng .fbhead{color:var(--ng)}
.fbhead .ico{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;flex:none}
.fb.ok .ico{background:var(--ok)}
.fb.ng .ico{background:var(--ng)}
.fbhead .spk{margin-left:auto;background:var(--chip)}
.yours{font-size:15px;margin:2px 0 4px;line-height:1.6}
.yours b{font-size:17px}
.sechead{font-size:12px;font-weight:700;color:var(--sub);margin:15px 0 7px;padding-top:12px;border-top:1px dashed var(--line)}
.senses{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.senses li{display:flex;gap:6px;font-size:14px;line-height:1.5;padding:6px 8px;border-radius:9px;align-items:flex-start}
.senses li.cur{background:rgba(59,91,253,.09);font-weight:700}
.senses .sn{color:var(--sub);font-weight:700;min-width:14px}
.senses .tag{font-size:10px;font-weight:700;color:#fff;background:var(--acc);border-radius:5px;padding:1px 5px;margin-left:auto;flex:none;align-self:center}
.optlist{display:grid;gap:7px}
.orow{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--bg);line-height:1.5}
.orow .mark{font-size:10px;font-weight:800;border-radius:5px;padding:2px 6px;background:var(--chip);color:var(--sub);flex:none;margin-top:2px;white-space:nowrap}
.orow.ok{background:var(--ok-bg)}
.orow.ok .mark{background:var(--ok);color:#fff}
.orow.bad{background:var(--ng-bg)}
.orow.bad .mark{background:var(--ng);color:#fff}
.nextbtn{margin-top:16px}

.rcard{background:linear-gradient(135deg,var(--acc),#7c5cfc);color:#fff;border-radius:20px;padding:22px 18px;text-align:center;margin-bottom:12px;box-shadow:0 16px 32px -18px var(--acc)}
.rscore{font-size:32px;font-weight:800;line-height:1.15}
.rrate{font-size:13px;opacity:.9;font-weight:600}
.rmsg{font-size:15px;font-weight:700;margin-top:4px}
.rmeta{font-size:12px;opacity:.95;margin-top:9px;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 10px}
.row2 .ghost{background:var(--card)}

.search{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;-webkit-appearance:none;appearance:none}
.brow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px}
.bhead{display:flex;align-items:center;gap:8px}
.bno{font-size:11px;color:var(--sub);font-weight:700;min-width:38px;flex:none}
.bw{font-weight:700;font-size:16px;flex:1;min-width:0;word-break:break-word}
.st{font-size:10px;font-weight:700;border-radius:999px;padding:2px 7px;flex:none}
.st0{background:var(--chip);color:var(--sub)}
.st1{background:rgba(245,158,11,.16);color:#b45309}
.st2{background:rgba(15,157,88,.15);color:var(--ok)}
.revbadge{font-size:10px;font-weight:700;color:var(--ng);background:var(--ng-bg);border-radius:999px;padding:2px 7px;flex:none}
.bsenses{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.6}
.bsenses .s{display:block}

.bigrate{font-size:42px;font-weight:800;line-height:1.05}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--chip);margin:12px 0}
.stack i{display:block;height:100%;width:0}
#st-b3{background:var(--ok)}
#st-b2{background:#f59e0b}
#st-b1{background:var(--line)}
.legend{display:grid;gap:6px;font-size:13px;color:var(--sub)}
.legend div{display:flex;align-items:center;gap:7px}
.legend b{margin-left:auto;color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.d3{background:var(--ok)}
.d2{background:#f59e0b}
.d1{background:var(--line)}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}

.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:30;max-width:780px;margin:0 auto}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--sub);padding:5px 0;border-radius:10px}
.tabbar button span{font-size:18px;line-height:1}
.tabbar button.on{color:var(--acc)}

@media (min-width:900px){
  #view-home{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start}
  #view-home > .hero,#view-home > .wide,#view-home > #btn-start,#view-home > #note-start{grid-column:1 / -1}
  #view-quiz,#view-result{max-width:760px;margin:0 auto}
  #in-from,#in-to{flex:0 0 180px;max-width:180px}
  .start-top{display:block;grid-column:1 / -1}
  .opt:hover{border-color:var(--acc)}
  .opt.ok:hover{border-color:var(--ok)}
  .opt.bad:hover{border-color:var(--ng)}
  .opt:disabled:hover{border-color:var(--line)}
  .opt.ok:disabled:hover{border-color:var(--ok)}
  .opt.bad:disabled:hover{border-color:var(--ng)}
  .chips button:hover{filter:brightness(.97)}
  .tabbar{border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:14px 14px 0 0}
}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(18,22,31,.95);color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;max-width:86%;z-index:60;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.3);line-height:1.5}

/* ================= 超ドパガキ演出 ================= */
.topright{display:flex;align-items:center;gap:8px;flex:none}
.sfxbtn{width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:15px;line-height:1;display:grid;place-items:center;flex:none}
.sfxbtn.off{opacity:.45;filter:grayscale(1)}

.hud{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:6px 9px;border-radius:999px;border:1px solid rgba(255,170,0,.4);background:linear-gradient(100deg,rgba(255,214,10,.18),rgba(255,45,85,.13) 60%,rgba(191,90,242,.14))}
.hud .rush{font-size:10.5px;font-weight:900;letter-spacing:.02em;padding:3px 9px;border-radius:999px;background:#ffd60a;color:#3a1d00;white-space:nowrap;flex:none}
.hud .rush.lv2{background:linear-gradient(90deg,#ff9f0a,#ff2d55);color:#fff}
.hud .rush.lv3{background:linear-gradient(90deg,#ffd60a,#ff2d55,#bf5af2);color:#fff;box-shadow:0 0 12px rgba(255,120,180,.7)}
.hud .rush.lv4{background:linear-gradient(90deg,#00d4ff,#bf5af2,#ff2d55,#ffd60a);color:#fff;box-shadow:0 0 16px rgba(120,220,255,.8)}
.hud .gauge{flex:1;height:6px;border-radius:99px;background:rgba(0,0,0,.13);overflow:hidden;min-width:30px}
.hud .gauge i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffd60a,#ff9f0a,#ff2d55,#bf5af2);transition:width .3s}
.hud .pts{font-size:10.5px;font-weight:800;color:#b45309;white-space:nowrap;flex:none}
.hud .pts b{font-size:14px;color:#8a3d00}
@media (prefers-color-scheme: dark){.hud .pts{color:#ffcf6a}.hud .pts b{color:#ffd60a}}
.hud .pts.bump{animation:ptsBump .45s ease-out}
@keyframes ptsBump{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}

#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:45}
#fx,#fx *{pointer-events:none !important}
#fx-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.fx-flash{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% 45%,#fffef8 0%,#fff0b0 22%,rgba(255,200,40,.45) 46%,rgba(255,120,0,0) 72%);transition:opacity .34s ease-out}
.fx-flash.bad{background:radial-gradient(circle at 50% 50%,rgba(255,90,90,.85) 0%,rgba(229,72,77,.3) 42%,rgba(229,72,77,0) 72%)}
.fx-flash.on{opacity:.45;transition:opacity .04s}

/* 周囲を暗くして真ん中を主役にする舞台照明 */
.fx-vig{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at 50% 45%,rgba(20,4,0,0) 34%,rgba(24,6,0,.22) 62%,rgba(20,4,0,.52) 100%);transition:opacity .5s ease-out}
.fx-vig.on{opacity:1;transition:opacity .08s}

.fx-halo{position:absolute;left:50%;top:45%;width:96vmax;height:96vmax;margin:-48vmax 0 0 -48vmax;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(255,255,240,.82) 0%,rgba(255,228,120,.5) 13%,rgba(255,175,0,.24) 26%,rgba(255,60,160,.08) 40%,rgba(140,0,255,0) 56%)}
.fx-halo.on{animation:haloGo 1.15s ease-out}
@keyframes haloGo{0%{opacity:0;transform:scale(.35)}12%{opacity:.9;transform:scale(.72)}55%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}

.fx-rays{position:absolute;left:50%;top:45%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;border-radius:50%;opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(255,214,10,.62) 0deg 4deg,rgba(255,214,10,0) 4deg 10deg);
  -webkit-mask-image:radial-gradient(circle,#000 4%,rgba(0,0,0,.55) 16%,rgba(0,0,0,.22) 30%,transparent 46%);
  mask-image:radial-gradient(circle,#000 4%,rgba(0,0,0,.55) 16%,rgba(0,0,0,.22) 30%,transparent 46%)}
.fx-rays.on{animation:raySpin 1.25s linear}
@keyframes raySpin{0%{opacity:0;transform:rotate(0deg) scale(.5)}14%{opacity:.95}66%{opacity:.8}100%{opacity:0;transform:rotate(80deg) scale(1.1)}}

.fx-frame{position:absolute;inset:3px;border-radius:16px;opacity:0;
  box-shadow:0 0 0 4px #ff2d55,0 0 22px 6px rgba(255,45,85,.8),inset 0 0 26px 3px rgba(255,45,85,.6)}
.fx-frame.on{animation:neonPulse 1.1s ease-in-out}
@keyframes neonPulse{0%{opacity:0;filter:hue-rotate(0deg)}10%{opacity:1}45%{opacity:.7;filter:hue-rotate(120deg)}70%{opacity:1;filter:hue-rotate(240deg)}100%{opacity:0;filter:hue-rotate(360deg)}}

.fx-cut{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:0;padding:0 5vw}
.fx-cut.on{opacity:1}
.fx-slot{display:none;gap:5px;margin-bottom:2px}
.fx-slot span{display:block;min-width:1.15em;padding:1px 4px;border-radius:7px;border:2px solid #7a3b00;background:linear-gradient(180deg,#fffdf0,#ffd54a 70%,#f3a300);color:#3a1d00;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(17px,5.4vw,26px);font-weight:900;line-height:1.25;text-align:center;box-shadow:0 2px 0 rgba(120,60,0,.5)}
.fx-cut.on .fx-slot span{animation:slotPop .5s cubic-bezier(.2,1.8,.4,1) both}
.fx-cut.on .fx-slot span:nth-child(2){animation-delay:.05s}
.fx-cut.on .fx-slot span:nth-child(3){animation-delay:.1s}
@keyframes slotPop{0%{transform:translateY(-26px) scale(.7);opacity:0}60%{transform:translateY(2px) scale(1.06)}100%{transform:none;opacity:1}}
.fx-stamp{font-weight:900;line-height:1.08;letter-spacing:.01em;white-space:nowrap;text-align:center;
  background:linear-gradient(180deg,#fffce8 0%,#ffe873 26%,#ffb300 50%,#ff7a00 60%,#fff6bd 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:2px rgba(92,38,0,.72);
  filter:drop-shadow(0 0 12px rgba(255,215,0,.95)) drop-shadow(0 0 34px rgba(255,120,0,.75)) drop-shadow(0 7px 0 rgba(122,48,0,.5));
  transform:scale(.2) rotate(-13deg)}
.fx-cut.on .fx-stamp{animation:stampIn .55s cubic-bezier(.16,1.75,.4,1) both}

<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="logo">L</div>
      <div><div class="t">LEAP 単語クイズ</div><div class="s" id="top-sub">2,300語</div></div>
    </div>
    <div class="topright">
      <button id="btn-sfx" class="sfxbtn" aria-label="効果音のオン・オフ" aria-pressed="true">🔊</button>
      <div class="toprate" id="top-rate">習得 0%</div>
    </div>
  </header>

  <main>
    <!-- ========== HOME ========== -->
    <section id="view-home" class="view">
      <button class="hero" id="hero-stats">
        <div class="hero-top"><span>習得状況（全単語）</span><b id="hero-rate">0%</b></div>
        <div class="bar"><i id="hero-bar"></i></div>
        <div class="hero-sub" id="hero-sub">習得済み 0語 ／ 要復習 0語</div>
      </button>

      <button id="btn-start-top" class="primary big start-top">クイズを始める</button>

      <div class="card">
        <div class="ch">出題形式</div>
        <div class="seg" id="seg-fmt">
          <button data-v="en2ja">英 → 日</button>
          <button data-v="ja2en">日 → 英</button>
          <button data-v="typing">タイピング</button>
        </div>
        <p class="note" id="note-fmt"></p>
      </div>

      <div class="card">
        <div class="ch">意味の範囲</div>
        <div class="seg" id="seg-sense">
          <button data-v="first">第1義のみ</button>
          <button data-v="rest">第2義以降</button>
          <button data-v="all">すべて</button>
        </div>
        <p class="note" id="note-sense"></p>
      </div>

      <div class="card wide">
        <div class="ch">範囲（単語番号）</div>
        <div class="rangerow">
          <input id="in-from" type="number" inputmode="numeric" min="1" max="2300" aria-label="開始番号">
          <span class="tilde">〜</span>
          <input id="in-to" type="number" inputmode="numeric" min="1" max="2300" aria-label="終了番号">
        </div>
        <div class="chips" id="presets">
          <button data-r="1-2300">全範囲</button>
          <button data-r="1-300">1–300</button>
          <button data-r="301-600">301–600</button>
          <button data-r="601-900">601–900</button>
          <button data-r="901-1200">901–1200</button>
          <button data-r="1201-1500">1201–1500</button>
          <button data-r="1501-1800">1501–1800</button>
          <button data-r="1801-2100">1801–2100</button>
          <button data-r="2101-2300">2101–2300</button>
        </div>
        <p class="note" id="note-range"></p>
      </div>

      <div class="card">
        <div class="ch">問題数</div>
        <div class="chips" id="counts">
          <button data-n="10">10</button>
          <button data-n="20">20</button>
          <button data-n="30">30</button>
          <button data-n="50">50</button>
          <button data-n="100">100</button>
          <button data-n="all">全問</button>
        </div>
        <div class="rangerow">
          <input id="in-count" type="number" inputmode="numeric" min="1" placeholder="任意の数" aria-label="任意の問題数">
          <button id="btn-count-apply" class="mini">この数で</button>
        </div>
      </div>

      <div class="card">
        <div class="ch">出題する単語</div>
        <div class="seg col" id="seg-target">
          <button data-v="all">すべて<span class="cnt" id="cnt-all"></span></button>
          <button data-v="new">未習得のみ<span class="cnt" id="cnt-new"></span></button>
          <button data-v="review">間違えた問題のみ<span class="cnt" id="cnt-rev"></span></button>
        </div>
      </div>

      <div class="card wide">
        <div class="ch">オプション</div>
        <label class="switch"><span>英単語の自動読み上げ</span><input type="checkbox" id="sw-speak"><i></i></label>
        <label class="switch"><span>正解したら「要復習」から外す</span><input type="checkbox" id="sw-rev"><i></i></label>
        <label class="switch"><span>超ドパガキ演出（大当りエフェクト）</span><input type="checkbox" id="sw-fx"><i></i></label>
        <label class="switch"><span>パチンコ効果音</span><input type="checkbox" id="sw-sfx"><i></i></label>
      </div>

      <button id="btn-start" class="primary big">クイズを始める</button>
      <p class="note center" id="note-start"></p>
    </section>

    <!-- ========== QUIZ ========== -->
    <section id="view-quiz" class="view" hidden>
      <div class="quiztop">
        <button id="btn-quit" class="icon" aria-label="やめる">✕</button>
        <div class="progress">
          <div class="bar"><i id="q-bar"></i></div>
          <div class="ptext"><span id="q-pos">1 / 20</span><span id="q-streak">🔥 0</span></div>
        </div>
      </div>

      <div class="hud" id="hud">
        <span class="rush lv1" id="hud-rush">COMBO ×0</span>
        <span class="gauge"><i id="hud-gauge"></i></span>
        <span class="pts"><b id="hud-pts">0</b> 脳汁</span>
      </div>

      <div class="qcard">
        <div class="qmeta">
          <span class="badge" id="q-badge">第1義</span>
          <span class="qno" id="q-no">No.1</span>
          <button class="spk" id="btn-speak" aria-label="発音を聞く">🔊</button>
        </div>
        <div class="prompt" id="q-prompt"></div>
      </div>

      <div id="answer-area"></div>
      <div class="qactions"><button id="btn-unknown" class="ghost">分からない</button></div>
      <div id="feedback"></div>
    </section>

    <!-- ========== RESULT ========== -->
    <section id="view-result" class="view" hidden>
      <div class="rcard">
        <div class="rscore" id="r-score">0 / 20</div>
        <div class="rrate" id="r-rate">正答率 0%</div>
        <div class="rmsg" id="r-msg"></div>
        <div class="rcombo" id="r-combo"></div>
        <div class="rmeta" id="r-meta"></div>
      </div>
      <div class="card" id="r-wrong-wrap">
        <div class="ch" id="r-wrong-title">間違えた問題</div>
        <div id="r-wrong"></div>
      </div>
      <div class="row2">
        <button id="btn-again" class="primary">もう一度</button>
        <button id="btn-review-again" class="ghost">間違えた問題だけ</button>
      </div>
      <button id="btn-home" class="ghost block">ホームへ戻る</button>
    </section>

    <!-- ========== BOOK ========== -->
    <section id="view-book" class="view" hidden>
      <div class="card">
        <div class="ch">単語帳・検索</div>
        <input id="book-q" type="search" class="search" placeholder="英単語・意味で検索（例: agree / 賛成）" autocomplete="off">
        <div class="chips" id="book-filters">
          <button data-f="all" class="on">すべて</button>
          <button data-f="review">要復習</button>
          <button data-f="new">未習得</button>
          <button data-f="learning">学習中</button>
          <button data-f="mastered">習得済み</button>
          <button data-f="multi">第2義あり</button>
        </div>
        <p class="note" id="book-count"></p>
      </div>
      <div id="book-list"></div>
      <button id="book-more" class="ghost block" hidden>さらに表示</button>
    </section>

    <!-- ========== STATS ========== -->
    <section id="view-stats" class="view" hidden>
      <div class="card">
        <div class="ch">全体の習熟度（全単語）</div>
        <div class="bigrate" id="st-rate">0%</div>
        <div class="stack"><i id="st-b3"></i><i id="st-b2"></i><i id="st-b1"></i></div>
        <div class="legend">
          <div><span class="dot d3"></span>習得済み<b id="st-m">0語</b></div>
          <div><span class="dot d2"></span>学習中<b id="st-l">0語</b></div>
          <div><span class="dot d1"></span>未学習<b id="st-n">0語</b></div>
        </div>
        <p class="note">同じ単語に2回正解すると「習得済み」になります。</p>
      </div>
      <div class="card">
        <div class="ch">いま選んでいる範囲</div>
        <p class="note" id="st-range" style="margin:0"></p>
      </div>
      <div class="card">
        <div class="ch">記録</div>
        <div class="kv"><span>要復習の単語</span><b id="st-rev">0語</b></div>
        <div class="kv"><span>第2義以降がある単語</span><b id="st-multi">0語</b></div>
        <div class="kv"><span>学習データの保存</span><b id="st-store">—</b></div>
        <div class="kv"><span>累計解答数</span><b id="st-ans">0回</b></div>
        <div class="kv"><span>累計正解数</span><b id="st-ok">0回</b></div>
      </div>
      <button id="btn-reset" class="ghost danger block">学習データをリセット</button>
    </section>
  </main>
</div>

<nav class="tabbar" id="tabbar">
  <button data-tab="home" class="on"><span>🏠</span>ホーム</button>
  <button data-tab="book"><span>📖</span>単語帳</button>
  <button data-tab="stats"><span>📊</span>習熟度</button>
</nav>
<div id="toast" class="toast" hidden></div>

    try { window.speechSynthesis.onvoiceschanged = pickVoice; } catch (e) { /* ignore */ }
  }
  function speak(text) {
    if (!canSpeak || !text) return;
    try {
      window.speechSynthesis.cancel();
      var u = new window.SpeechSynthesisUtterance(String(text).replace(/[～~]/g, " ").replace(/\s+/g, " ").trim());
      u.lang = "en-US";
      u.rate = 0.9;
      u.pitch = 1;
      if (VOICE) u.voice = VOICE;
      window.speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
  }

  /* ---------------- views ---------------- */
  function show(name) {
    ["home", "quiz", "result", "book", "stats"].forEach(function (n) {
      var v = $("view-" + n);
      if (v) v.hidden = (n !== name);
    });
    var tb = $("tabbar");
    if (tb) tb.hidden = (name === "quiz");
    var tabs = document.querySelectorAll("#tabbar button");
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle("on", tabs[i].getAttribute("data-tab") === name);
    }
    window.scrollTo(0, 0);
  }

  function setSeg(id, val) {
    var bs = document.querySelectorAll("#" + id + " button");
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle("on", bs[i].getAttribute("data-v") === val);
  }
  function setChips(id, test) {
    var bs = document.querySelectorAll("#" + id + " button");
    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle("on", test(bs[i]));
  }

  /* ---------------- pool / question building ---------------- */
  function senseIdxsFor(w) {
    if (cfg.sense === "first") return [0];
    if (cfg.sense === "rest") {
      if (w.senses.length < 2) return [];
      var a = [];
      for (var i = 1; i < w.senses.length; i++) a.push(i);
      return a;
    }
    return w.senses.map(function (_, i) { return i; });
  }

  function buildPool(restrictIds) {
    var set = null;
    if (restrictIds && restrictIds.length) {
      set = {};
      restrictIds.forEach(function (id) { set[id] = 1; });
    }
    var out = [];
    for (var i = 0; i < WORDS.length; i++) {
      var w = WORDS[i];
      if (set) {
        if (!set[w.id]) continue;
      } else {
        if (w.id < cfg.from || w.id > cfg.to) continue;
        if (cfg.target === "new" && statOf(w.id) >= 2) continue;
        if (cfg.target === "review" && !isRev(w.id)) continue;
      }
      if (!senseIdxsFor(w).length) continue;
      out.push(w);
    }
    return out;
  }

  function pickDistractors(opts, used, samePool, allPool, skip) {
    var tries = 0;
    while (opts.length < 4 && tries < 300) {
      tries++;
      var src = (samePool.length && Math.random() < 0.6) ? samePool : allPool;
      var c = src[(Math.random() * src.length) | 0];
      if (!c) break;
      if (skip(c)) continue;
      var nt = normT(c.t);
      if (used[nt]) continue;
      used[nt] = 1;
      opts.push({ wid: c.wid, si: c.si, t: c.t, p: c.p, w: c.w, correct: false });
    }
    if (opts.length < 4) {
      for (var k = 0; k < allPool.length && opts.length < 4; k++) {
        var d = allPool[k];
        if (skip(d)) continue;
        var nt2 = normT(d.t);
        if (used[nt2]) continue;
        used[nt2] = 1;
        opts.push({ wid: d.wid, si: d.si, t: d.t, p: d.p, w: d.w, correct: false });
      }
    }
    return opts;
  }

  function meaningOptions(w, sense) {
    var opts = [{ wid: w.id, si: sense.i, t: sense.t, p: sense.p, w: w.w, correct: true }];
    var used = {};
    used[normT(sense.t)] = 1;
    w.senses.forEach(function (s) { used[normT(s.t)] = 1; });
    var samePool = BYPOS[sense.p] || [];
    pickDistractors(opts, used, samePool, ALLS, function (c) { return c.wid === w.id; });
    return shuffle(opts);
  }

  function wordOptions(w, sense) {
    var group = TEXT2IDS[sense.t] || {};
    var opts = [{ wid: w.id, w: w.w, correct: true }];
    var used = {};
    used[normW(w.w)] = 1;
    var samePool = BYPOSW[sense.p] || [];
    var tries = 0;
    function addWord(x) {
      var nw = normW(x.w);
      if (group[x.id] || used[nw]) return false;
      used[nw] = 1;
      opts.push({ wid: x.id, w: x.w, correct: false });
      return true;
    }
    while (opts.length < 4 && tries < 300) {
      tries++;
      var src = (samePool.length && Math.random() < 0.6) ? samePool : ALLWORDS;
      var c = src[(Math.random() * src.length) | 0];
      if (c) addWord(c);
    }
    if (opts.length < 4) {
      for (var k = 0; k < ALLWORDS.length && opts.length < 4; k++) addWord(ALLWORDS[k]);
    }
    return shuffle(opts);
  }

  function makeQuestion(w, si) {
    var sense = w.senses[si];
    var q = { word: w, si: si, sense: sense, fmt: cfg.fmt, options: [], answerIdx: 0 };
    if (cfg.fmt === "en2ja") q.options = meaningOptions(w, sense);
    else if (cfg.fmt === "ja2en") q.options = wordOptions(w, sense);
    for (var i = 0; i < q.options.length; i++) {
      if (q.options[i].correct) { q.answerIdx = i; break; }
    }
    return q;
  }

  function countMastered() {
    var n = 0;
    for (var i = 0; i < WORDS.length; i++) if (statOf(WORDS[i].id) === 2) n++;
    return n;
  }

  /* ---------------- home ---------------- */
  function renderHome() {
    setSeg("seg-fmt", cfg.fmt);
    setSeg("seg-sense", cfg.sense);
    setSeg("seg-target", cfg.target);

    $("in-from").value = cfg.from;
    $("in-to").value = cfg.to;

    if (cfg.countMode === "preset") {
      setChips("counts", function (b) { return b.getAttribute("data-n") === String(cfg.count); });
      $("in-count").value = "";
    } else if (cfg.countMode === "all") {
      setChips("counts", function (b) { return b.getAttribute("data-n") === "all"; });
      $("in-count").value = "";
    } else {
      setChips("counts", function () { return false; });
      $("in-count").value = cfg.count;
    }

    var inRange = 0, fresh = 0, rev = 0;
    for (var i = 0; i < WORDS.length; i++) {
      var w = WORDS[i];
      if (w.id < cfg.from || w.id > cfg.to) continue;
      inRange++;
      if (statOf(w.id) < 2) fresh++;
      if (isRev(w.id)) rev++;
    }
    $("cnt-all").textContent = num(inRange) + "語";
    $("cnt-new").textContent = num(fresh) + "語";
    $("cnt-rev").textContent = num(rev) + "語";

    var pool = buildPool(null);
    var n = cfg.countMode === "all" ? pool.length : Math.min(cfg.count, pool.length);
    var labels = {
      en2ja: "英単語を見て、日本語の意味を選びます。",
      ja2en: "日本語の意味を見て、英単語を選びます。",
      typing: "日本語の意味を見て、英単語をキーボードで入力します。"
    };
    $("note-fmt").textContent = labels[cfg.fmt];
    $("note-sense").textContent = cfg.sense === "first"
      ? "すべての単語の第1義（①）を出題します。"
      : cfg.sense === "rest"
        ? "②以降の意味がある単語だけを対象に、第2義以降を出題します。"
        : "第1義も第2義以降も、すべての意味から出題します。";
    $("note-range").textContent = "No." + num(cfg.from) + " 〜 No." + num(cfg.to) + "（" + num(inRange) + "語）";
    $("note-start").textContent = pool.length
      ? "この条件で出題できる単語は " + num(pool.length) + "語。今回は " + n + "問です。"
      : "この条件に合う単語がありません。範囲や出題対象を変えてください。";

    $("sw-speak").checked = !!cfg.autoSpeak;
    $("sw-rev").checked = !!cfg.removeRev;
    if ($("sw-fx")) $("sw-fx").checked = cfg.fx !== false;
    if ($("sw-sfx")) $("sw-sfx").checked = cfg.sfx !== false;
    syncSfxBtn();

    var m = countMastered();
    $("hero-rate").textContent = Math.round((m / N) * 100) + "%";
    $("hero-bar").style.width = ((m / N) * 100).toFixed(1) + "%";
    $("hero-sub").textContent = "習得済み " + num(m) + "語 ／ 要復習 " + num(rev) + "語";
  }

  /* ---------------- 超ドパガキHUD ---------------- */
  function hudLevel(st) {
    return st >= 10 ? 4 : st >= 5 ? 3 : st >= 3 ? 2 : 1;
  }

  function hudUpdate(bump) {
    var rush = $("hud-rush"), g = $("hud-gauge"), p = $("hud-pts");
    if (!rush) return;
    var st = S.streak || 0, sv = S.score || 0;
    var lv = hudLevel(st);
    var label = st >= 10 ? "天元突破 RUSH" : st >= 5 ? "超GOD RUSH" : st >= 3 ? "確変RUSH" : "COMBO";
    rush.textContent = label + " ×" + st;
    rush.className = "rush lv" + lv;
    if (g) g.style.width = (st === 0 ? 0 : (st % 5 === 0 ? 100 : (st % 5) * 20)) + "%";
    if (p) {
      p.textContent = num(sv);
      if (bump) {
        p.classList.remove("bump");
        void p.offsetWidth;
        p.classList.add("bump");
      }
    }
  }

  function syncSfxBtn() {
    var b = $("btn-sfx");
    if (!b) return;
    var onSfx = cfg.sfx !== false;
    b.textContent = onSfx ? "🔊" : "🔇";
    b.className = "sfxbtn" + (onSfx ? "" : " off");
    b.setAttribute("aria-pressed", onSfx ? "true" : "false");
    b.setAttribute("aria-label", onSfx ? "効果音をオフにする" : "効果音をオンにする");
  }

  /* ---------------- quiz ---------------- */
  var S = { qs: [], i: 0, correct: 0, streak: 0, best: 0, wrong: [], answered: false, masteredBefore: 0, restrict: null, score: 0 };

  function startQuiz(restrictIds) {
    var pool = buildPool(restrictIds);
    if (!pool.length) {
      toast(restrictIds && restrictIds.length ? "対象の単語がありません。" : "条件に合う単語がありません。範囲を変えてみてください。");
      return;
    }
    shuffle(pool);
    var n = cfg.countMode === "all" ? pool.length : Math.min(cfg.count, pool.length);
    var chosen = pool.slice(0, n);

    S = {
      qs: [], i: 0, correct: 0, streak: 0, best: 0, wrong: [],
      answered: false, masteredBefore: countMastered(), restrict: restrictIds || null, score: 0
    };
    chosen.forEach(function (w) {
      var idxs = senseIdxsFor(w) || [0];
      var si = idxs[Math.floor(Math.random() * idxs.length)];
      S.qs.push(makeQuestion(w, si));
    });
    if (!S.qs.length) { toast("問題を作れませんでした。"); return; }
    show("quiz");
    renderQ();
  }

  function renderQ() {
    var q = S.qs[S.i];
    S.answered = false;
    FX.quiet();
    window.scrollTo(0, 0);
    $("q-pos").textContent = (S.i + 1) + " / " + S.qs.length;
    $("q-bar").style.width = ((S.i) / S.qs.length * 100) + "%";
    $("q-streak").textContent = "🔥 " + S.streak;
    hudUpdate(false);

    var badge = $("q-badge");
    badge.textContent = "第" + (q.si + 1) + "義";
    badge.classList.toggle("hi", q.si > 0);
    $("q-no").textContent = "No." + q.word.id;

    var spk = $("btn-speak");
    spk.hidden = q.fmt !== "en2ja";

    var promptEl = $("q-prompt");
    if (q.fmt === "en2ja") {
      promptEl.innerHTML = '<div class="eword">' + esc(q.word.w) + "</div>";
    } else {
      promptEl.innerHTML = '<div class="jmeaning">' + posChip(q.sense.p) + "<span>" + esc(q.sense.t) + "</span></div>";
    }

    buildAnswerArea(q);
    $("feedback").innerHTML = "";
    var unk = $("btn-unknown");
    unk.hidden = false;
    unk.disabled = false;
    unk.textContent = "分からない";

    if (cfg.autoSpeak && q.fmt === "en2ja") speak(q.word.w);
  }

  function buildAnswerArea(q) {
    var area = $("answer-area");
    if (q.fmt === "typing") {
      area.innerHTML =
        '<div class="typewrap">' +
        '<input id="tin" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="英単語を入力">' +
        '<button id="btn-check" class="primary">判定</button>' +
        "</div>" +
        '<div class="hintrow"><button id="btn-hint" class="ghost small">ヒント</button><span id="hinttext" class="note"></span></div>';
      var inp = $("tin");
      inp.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          if (S.answered) nextQ(); else submitTyped();
        }
      });
      inp.addEventListener("focus", function () {
        setTimeout(function () {
          try { inp.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (e) { /* ignore */ }
        }, 320);
      });
      $("btn-check").addEventListener("click", submitTyped);
      $("btn-hint").addEventListener("click", showHint);
      setTimeout(function () { try { inp.focus(); } catch (e) { /* ignore */ } }, 90);
    } else {
      var html = '<div class="opts">';
      q.options.forEach(function (o, k) {
        html += '<button class="opt" data-k="' + k + '"><span class="num">' + (k + 1) + "</span>" + optInner(q, o) + "</button>";
      });
      html += "</div>";
      area.innerHTML = html;
      var bs = area.querySelectorAll(".opt");
      for (var i = 0; i < bs.length; i++) {
        bs[i].addEventListener("click", function () {
          var k = parseInt(this.getAttribute("data-k"), 10);
          if (!S.answered) answerOption(k);
        });
      }
    }
  }

  function optInner(q, o) {
    if (q.fmt === "en2ja") return '<span class="otx">' + posChip(o.p) + esc(o.t) + "</span>";
    return '<span class="otx"><b>' + esc(o.w) + "</b></span>";
  }

  function answerOption(k) {
    var q = S.qs[S.i];
    var ok = !!q.options[k].correct;
    finishAnswer(ok, k, null);
  }

  function submitTyped() {
    if (S.answered) return;
    var inp = $("tin");
    var v = inp ? inp.value : "";
    if (!v.trim()) { if (inp) inp.focus(); return; }
    var q = S.qs[S.i];
    finishAnswer(checkTyped(q, v), "typed", v.trim());
  }

  function checkTyped(q, v) {
    var got = normW(v);
    if (!got) return false;
    if (got === normW(q.word.w)) return true;
    var group = TEXT2IDS[q.sense.t] || {};
    for (var id in group) {
      if (BYID[id] && normW(BYID[id].w) === got) return true;
    }
    return false;
  }

  function showHint() {
    var q = S.qs[S.i];
    var src = q.word.w.replace(/[～~]/g, "").trim();
    var out = "", prevLetter = false, count = 0;
    for (var i = 0; i < src.length; i++) {
      var c = src.charAt(i);
      if (/[A-Za-z]/.test(c)) {
        count++;
        out += prevLetter ? "_" : c;
        prevLetter = true;
      } else {
        if (c === " ") out += " ";
        else if (c === "-") out += "-";
        prevLetter = false;
      }
    }
    $("hinttext").textContent = out + "（" + count + "文字）";
  }

  function finishAnswer(ok, chosen, typedText) {
    if (S.answered) return;
    S.answered = true;
    var q = S.qs[S.i], w = q.word;
    var r = rec(w.id);

    if (ok) {
      r.c = (r.c || 0) + 1;
      S.correct++;
      S.streak++;
      if (S.streak > S.best) S.best = S.streak;
      S.score = (S.score || 0) + 100 + (Math.min(S.streak, 10) - 1) * 50;
      if (cfg.removeRev) r.rev = 0;
    } else {
      r.w = (r.w || 0) + 1;
      S.streak = 0;
      r.rev = 1;
      S.wrong.push({ id: w.id, si: q.si, word: w.w, t: q.sense.t, p: q.sense.p });
    }
    var sk = "i" + q.si;
    var sr = r.s[sk] || (r.s[sk] = { c: 0, w: 0 });
    if (ok) sr.c++; else sr.w++;
    save();

    if (q.fmt !== "typing") {
      var bs = document.querySelectorAll("#answer-area .opt");
      for (var i = 0; i < bs.length; i++) {
        bs[i].disabled = true;
        if (q.options[i].correct) bs[i].classList.add("ok");
        else if (i === chosen) bs[i].classList.add("bad");
      }
    } else {
      var inp = $("tin"), cb = $("btn-check"), hb = $("btn-hint");
      if (inp) { inp.disabled = true; inp.classList.toggle("ok", ok); inp.classList.toggle("bad", !ok); }
      if (cb) cb.disabled = true;
      if (hb) hb.disabled = true;
    }

    $("btn-unknown").hidden = true;
    $("q-streak").textContent = "🔥 " + S.streak;
    $("q-bar").style.width = ((S.i + 1) / S.qs.length * 100) + "%";

    renderFeedback(ok, chosen, typedText);
    updateTopRate();
    hudUpdate(ok);
    if (ok) {
      FX.correct(S.streak);
      if (cfg.sfx) SND.correct(FX.tier(S.streak).level);
    } else {
      FX.wrong();
      if (cfg.sfx) SND.buzz();
    }
    if (cfg.autoSpeak && q.fmt !== "en2ja") speak(w.w);
  }

  function sensesList(w, currentIdx) {
    var out = '<ul class="senses">';
    w.senses.forEach(function (s, i) {
      out += '<li class="' + (i === currentIdx ? "cur" : "") + '">' +
        '<span class="sn">' + markOf(i) + "</span>" + posChip(s.p) +
        "<span>" + esc(s.t) + "</span>" +
        (i === currentIdx ? '<span class="tag">出題</span>' : "") +
        "</li>";
    });
    return out + "</ul>";
  }

  function sensesLine(w, limit) {
    var n = limit || 3;
    var parts = w.senses.slice(0, n).map(function (s, i) {
      return (w.senses.length > 1 ? markOf(i) + " " : "") + s.t;
    });
    return parts.join(" / ") + (w.senses.length > n ? " …" : "");
  }

  function renderFeedback(ok, chosen, typedText) {
    var q = S.qs[S.i], w = q.word;
    var h = '<div class="fb ' + (ok ? "ok" : "ng") + '">';
    var head = ok ? "正解！" : (chosen === "unknown" ? "「分からない」にしました" : "不正解…");
    h += '<div class="fbhead"><span class="ico">' + (ok ? "✓" : "✕") + "</span>" + head +
      '<button class="spk" id="fb-speak" aria-label="発音">🔊</button></div>';

    if (q.fmt === "en2ja") {
      h += '<div class="yours">正解は <b>' + esc(q.sense.t) + "</b></div>";
      if (!ok && chosen !== "unknown") h += '<div class="yours note">あなたの解答：' + esc(q.options[chosen].t) + "</div>";
    } else {
      h += '<div class="yours">正解は <b>' + esc(w.w) + "</b></div>";
      if (!ok && chosen === "typed") h += '<div class="yours note">あなたの入力：' + esc(typedText || "") + "</div>";
    }

    h += '<div class="sechead">' + esc(w.w) + " の意味（全" + w.senses.length + "義）</div>";
    h += sensesList(w, q.si);

    if (q.fmt !== "typing") {
      h += '<div class="sechead">選択肢の単語と意味</div><div class="optlist">';
      q.options.forEach(function (o, k) {
        var cls = o.correct ? "ok" : (k === chosen ? "bad" : "");
        var label = o.correct ? "正解" : (k === chosen ? "あなた" : "他");
        var target = BYID[o.wid];
        var body;
        if (q.fmt === "en2ja") {
          body = "<b>" + esc(target.w) + "</b> " + posChip(o.p) + esc(o.t) +
            (target.senses.length > 1 ? '<div class="note">別義：' + esc(target.senses.filter(function (s) { return s.t !== o.t; }).slice(0, 2).map(function (s) { return s.t; }).join(" / ")) + "</div>" : "");
        } else {
          body = "<b>" + esc(target.w) + "</b>" + '<div class="note">' + esc(sensesLine(target, 3)) + "</div>";
        }
        h += '<div class="orow ' + cls + '"><span class="mark">' + label + "</span><div>" + body + "</div></div>";
      });
      h += "</div>";
    } else {
      var group = TEXT2IDS[q.sense.t] || {};
      var others = [];
      for (var id in group) if (String(id) !== String(w.id) && BYID[id]) others.push(BYID[id].w);
      if (others.length) {
        h += '<div class="sechead">同じ意味のほかの単語</div><div class="note">' + esc(others.join(" / ")) + "（どちらで答えても正解）</div>";
      }
    }

    h += '<button id="btn-next" class="primary nextbtn">' + (S.i + 1 >= S.qs.length ? "結果を見る" : "次へ") + "</button>";
    h += "</div>";
    $("feedback").innerHTML = h;
    try {
      var fbEl = $("feedback");
      var rect = fbEl.getBoundingClientRect();
      if (rect.top > window.innerHeight - 140) fbEl.scrollIntoView({ block: "center", behavior: "smooth" });
    } catch (e) { /* ignore */ }
    $("btn-next").addEventListener("click", nextQ);
    var fs = $("fb-speak");
    if (fs) fs.addEventListener("click", function () { speak(w.w); });
  }

  function nextQ() {
    if (!S.answered) return;
    if (S.i + 1 >= S.qs.length) { finishQuiz(); return; }
    S.i++;
    renderQ();
  }

  function answerUnknown() {
    if (S.answered) return;
    finishAnswer(false, "unknown", null);
  }

  function finishQuiz() {
    var total = S.qs.length;
    var ok = S.correct;
    var rate = total ? Math.round((ok / total) * 100) : 0;
    var masteredNow = countMastered();

    $("r-score").textContent = ok + " / " + total;
    $("r-rate").textContent = "正答率 " + rate + "%";
    $("r-msg").textContent = rate >= 90 ? "すばらしい！" : rate >= 70 ? "よくできています" : rate >= 50 ? "あと少し" : "復習して固めよう";
    if ($("r-combo")) {
      $("r-combo").innerHTML = "最大 <b>" + S.best + "</b> 連コンボ ・ 脳汁 <b>" + num(S.score) + "</b> pt";
    }
    $("r-meta").innerHTML = "習得済み " + S.masteredBefore + " → <b>" + masteredNow + "</b> 語";

    var seen = {}, uniq = [];
    S.wrong.forEach(function (x) {
      var k = x.id + "-" + x.si;
      if (seen[k]) return;
      seen[k] = 1; uniq.push(x);
    });

    if (uniq.length) {
      var h = "";
      uniq.forEach(function (x) {
        h += '<div class="brow"><div class="bhead"><span class="bno">#' + x.id + "</span>" +
          '<span class="bw">' + esc(x.word) + "</span>" +
          '<span class="revbadge">' + (x.si + 1) + "義</span></div>" +
          '<div class="bsenses"><span class="s">' + posChip(x.p) + esc(x.t) + "</span></div></div>";
      });
      $("r-wrong").innerHTML = h;
      $("r-wrong-title").textContent = "間違えた問題（" + uniq.length + "件）";
      $("r-wrong-wrap").hidden = false;
      $("btn-review-again").hidden = false;
    } else {
      $("r-wrong").innerHTML = '<div class="note">全問正解でした。この調子で続けましょう。</div>';
      $("r-wrong-title").textContent = "間違えた問題";
      $("r-wrong-wrap").hidden = false;
      $("btn-review-again").hidden = true;
    }
    show("result");
    FX.result(rate);
    if (cfg.sfx) SND.win();
  }

  function updateTopRate() {
    var m = countMastered();
    $("top-rate").textContent = "習得 " + Math.round((m / N) * 100) + "%";
  }

  /* ---------------- book ---------------- */
  var bookQ = "", bookFilter = "all", bookShown = 100;

  function bookMatch(w) {
    if (bookQ) {
      var q = bookQ.toLowerCase();
      var hit = w.w.toLowerCase().indexOf(q) >= 0;
      if (!hit) {
        for (var i = 0; i < w.senses.length; i++) {
          if (w.senses[i].t.indexOf(bookQ) >= 0) { hit = true; break; }
        }
      }
      if (!hit) return false;
    }
    switch (bookFilter) {
      case "review": return isRev(w.id);
      case "new": return statOf(w.id) === 0;
      case "learning": return statOf(w.id) === 1;
      case "mastered": return statOf(w.id) === 2;
      case "multi": return w.senses.length > 1;
      default: return true;
    }
  }

  function renderBook() {
    var list = [];
    for (var i = 0; i < WORDS.length; i++) if (bookMatch(WORDS[i])) list.push(WORDS[i]);
    $("book-count").textContent = num(list.length) + "語 ／ 全" + num(N) + "語";
    var h = "";
    var upto = Math.min(bookShown, list.length);
    for (var j = 0; j < upto; j++) {
      var w = list[j], st = statOf(w.id);
      var stLabel = st === 2 ? "習得済み" : (st === 1 ? "学習中" : "未学習");
      h += '<div class="brow">' +
        '<div class="bhead"><span class="bno">#' + w.id + "</span>" +
        '<span class="bw">' + esc(w.w) + "</span>" +
        (isRev(w.id) ? '<span class="revbadge">要復習</span>' : "") +
        '<span class="st st' + st + '">' + stLabel + "</span>" +
        '<button class="spk bspeak" data-w="' + esc(w.w) + '" aria-label="発音">🔊</button></div>' +
        '<div class="bsenses">' + w.senses.map(function (s, k) {
          return '<span class="s">' + (w.senses.length > 1 ? markOf(k) + " " : "") + posChip(s.p) + esc(s.t) + "</span>";
        }).join("") + "</div></div>";
    }
    $("book-list").innerHTML = h || '<div class="note">該当する単語がありません。</div>';
    $("book-more").hidden = list.length <= bookShown;
    var bs = document.querySelectorAll(".bspeak");
    for (var k = 0; k < bs.length; k++) {
      bs[k].addEventListener("click", function () { speak(this.getAttribute("data-w")); });
    }
  }

  /* ---------------- stats ---------------- */
  function renderStats() {
    var c = [0, 0, 0], rev = 0, ans = 0, okc = 0;
    for (var i = 0; i < WORDS.length; i++) {
      var w = WORDS[i], s = statOf(w.id);
      c[s]++;
      var r = ST.words[w.id];
      if (r) {
        if (r.rev) rev++;
        ans += (r.c || 0) + (r.w || 0);
        okc += (r.c || 0);
      }
    }
    var m = c[2];
    $("st-rate").textContent = Math.round((m / N) * 100) + "%";
    $("st-m").textContent = num(m) + "語";
    $("st-l").textContent = num(c[1]) + "語";
    $("st-n").textContent = num(c[0]) + "語";
    $("st-b3").style.width = (m / N * 100) + "%";
    $("st-b2").style.width = (c[1] / N * 100) + "%";
    $("st-b1").style.width = (c[0] / N * 100) + "%";
    $("st-rev").textContent = num(rev) + "語";
    $("st-multi").textContent = num(MULTI) + "語";
    $("st-ans").textContent = num(ans) + "回";
    $("st-ok").textContent = num(okc) + "回";

    var inRange = 0, rm = 0;
    for (var j = 0; j < WORDS.length; j++) {
      var ww = WORDS[j];
      if (ww.id < cfg.from || ww.id > cfg.to) continue;
      inRange++;
      if (statOf(ww.id) === 2) rm++;
    }
    $("st-range").textContent = "No." + num(cfg.from) + " 〜 No." + num(cfg.to) + "：" + num(inRange) + "語中 " + num(rm) + "語 習得（" + (inRange ? Math.round(rm / inRange * 100) : 0) + "%）";
  }

  /* ---------------- wiring ---------------- */
  function wire() {
    var i;
    var fmtBtns = document.querySelectorAll("#seg-fmt button");
    for (i = 0; i < fmtBtns.length; i++) {
      fmtBtns[i].addEventListener("click", function () {
        cfg.fmt = this.getAttribute("data-v");
        save(); renderHome();
      });
    }
    var senseBtns = document.querySelectorAll("#seg-sense button");
    for (i = 0; i < senseBtns.length; i++) {
      senseBtns[i].addEventListener("click", function () {
        cfg.sense = this.getAttribute("data-v");
        save(); renderHome();
      });
    }
    var tgtBtns = document.querySelectorAll("#seg-target button");
    for (i = 0; i < tgtBtns.length; i++) {
      tgtBtns[i].addEventListener("click", function () {
        cfg.target = this.getAttribute("data-v");
        save(); renderHome();
      });
    }
    var countBtns = document.querySelectorAll("#counts button");
    for (i = 0; i < countBtns.length; i++) {
      countBtns[i].addEventListener("click", function () {
        var v = this.getAttribute("data-n");
        if (v === "all") { cfg.countMode = "all"; }
        else { cfg.countMode = "preset"; cfg.count = parseInt(v, 10); }
        save(); renderHome();
      });
    }
    var presetBtns = document.querySelectorAll("#presets button");
    for (i = 0; i < presetBtns.length; i++) {
      presetBtns[i].addEventListener("click", function () {
        var p = this.getAttribute("data-r").split("-");
        cfg.from = parseInt(p[0], 10);
        cfg.to = parseInt(p[1], 10);
        save(); renderHome();
      });
    }

    function clampRange() {
      var a = parseInt($("in-from").value, 10);
      var b = parseInt($("in-to").value, 10);
      if (isNaN(a)) a = 1;
      if (isNaN(b)) b = N;
      a = Math.min(Math.max(1, a), N);
      b = Math.min(Math.max(1, b), N);
      if (a > b) { var t = a; a = b; b = t; }
      cfg.from = a; cfg.to = b;
      save(); renderHome();
    }
    $("in-from").addEventListener("change", clampRange);
    $("in-to").addEventListener("change", clampRange);

    $("btn-count-apply").addEventListener("click", function () {
      var v = parseInt($("in-count").value, 10);
      if (isNaN(v) || v < 1) { toast("1以上の数を入力してください。"); return; }
      cfg.count = Math.min(v, N);
      cfg.countMode = "custom";
      save(); renderHome();
    });
    $("in-count").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); $("btn-count-apply").click(); }
    });

    $("sw-speak").addEventListener("change", function () { cfg.autoSpeak = this.checked; save(); });
    $("sw-rev").addEventListener("change", function () { cfg.removeRev = this.checked; save(); });

    // 効果音・演出のオン/オフ
    function setSfx(v) {
      cfg.sfx = !!v;
      save();
      syncSfxBtn();
      var sw = $("sw-sfx");
      if (sw) sw.checked = cfg.sfx;
      if (cfg.sfx) SND.unlock();
    }
    var sb = $("btn-sfx");
    if (sb) sb.addEventListener("click", function () { setSfx(cfg.sfx === false); });
    var swSfx = $("sw-sfx");
    if (swSfx) swSfx.addEventListener("change", function () { setSfx(this.checked); });
    var swFx = $("sw-fx");
    if (swFx) {
      swFx.addEventListener("change", function () {
        cfg.fx = this.checked;
        save();
        if (!cfg.fx) FX.skip();
      });
    }

    // iOS Safari 用：最初のタップ／キー入力でオーディオをアンロック
    var unlockAudio = function () { SND.unlock(); };
    document.addEventListener("pointerdown", unlockAudio, { once: true, passive: true });
    document.addEventListener("touchstart", unlockAudio, { once: true, passive: true });
    document.addEventListener("keydown", unlockAudio, { once: true });

    // 演出中のタップは演出だけスキップ（「次へ」などの操作はそのまま通す）
    document.addEventListener("pointerdown", function () {
      if (S.answered) FX.skip();
    }, true);

    $("btn-start").addEventListener("click", function () { startQuiz(null); });
    var topStart = $("btn-start-top");
    if (topStart) topStart.addEventListener("click", function () { startQuiz(null); });
    $("hero-stats").addEventListener("click", function () { renderStats(); show("stats"); });

    $("btn-quit").addEventListener("click", function () {
      if (!S.answered && S.i > 0 && !window.confirm("クイズを中断しますか？（ここまでの結果は保存済みです）")) return;
      renderHome(); renderStats(); show("home");
    });
    $("btn-speak").addEventListener("click", function () {
      if (S.qs[S.i]) speak(S.qs[S.i].word.w);
    });
    $("btn-unknown").addEventListener("click", answerUnknown);

    $("btn-again").addEventListener("click", function () { startQuiz(S.restrict); });
    $("btn-review-again").addEventListener("click", function () {
      var ids = S.wrong.map(function (x) { return x.id; });
      startQuiz(ids);
    });
    $("btn-home").addEventListener("click", function () {
      renderHome(); renderStats(); renderBook(); show("home");
    });

    var tabs = document.querySelectorAll("#tabbar button");
    for (i = 0; i < tabs.length; i++) {
      tabs[i].addEventListener("click", function () {
        var t = this.getAttribute("data-tab");
        if (t === "home") renderHome();
        if (t === "book") renderBook();
        if (t === "stats") renderStats();
        show(t);
      });
    }

    var filters = document.querySelectorAll("#book-filters button");
    for (i = 0; i < filters.length; i++) {
      filters[i].addEventListener("click", function () {
        bookFilter = this.getAttribute("data-f");
        bookShown = 100;
        for (var k = 0; k < filters.length; k++) filters[k].classList.toggle("on", filters[k] === this);
        renderBook();
      });
    }
    $("book-q").addEventListener("input", function () {
      bookQ = this.value.trim();
      bookShown = 100;
      renderBook();
    });
    $("book-more").addEventListener("click", function () { bookShown += 100; renderBook(); });

    $("btn-reset").addEventListener("click", function () {
      if (!window.confirm("習得状況と要復習リストをすべて削除します。よろしいですか？")) return;
      ST.words = {};
      save();
      renderAll();
      toast("学習データをリセットしました。");
    });

    document.addEventListener("keydown", function (e) {
      if ($("view-quiz").hidden) return;
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
      if (e.key === "Enter") {
        if (S.answered) { e.preventDefault(); nextQ(); }
        return;
      }
      if (S.answered || cfg.fmt === "typing") return;
      var k = parseInt(e.key, 10);
      if (k >= 1 && k <= 4 && S.qs[S.i] && k <= S.qs[S.i].options.length) {
        e.preventDefault();
        answerOption(k - 1);
      }
    });
  }

  function renderAll() {
    renderHome();
    renderStats();
    renderBook();
    updateTopRate();
  }

  function storageWorks() {
    try {
      localStorage.setItem("leapQuiz.probe", "1");
      localStorage.removeItem("leapQuiz.probe");
      return true;
    } catch (e) { return false; }
  }

  function init() {
    var storeEl = $("st-store");
    if (storeEl) storeEl.textContent = storageWorks() ? "有効（この端末に保存）" : "無効（ブラウザの設定でブロック中）";
    $("top-sub").textContent = N.toLocaleString() + "語 ・ 第2義以降 " + MULTI.toLocaleString() + "語";
    FX.init();
    wire();
    renderAll();
    show("home");
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();

  // テスト用フック
  window.__leap = {
    WORDS: WORDS,
    cfg: function () { return cfg; },
    state: function () { return ST; },
    S: function () { return S; },
    start: startQuiz,
    answer: answerOption,
    unknown: answerUnknown,
    next: nextQ,
    stats: renderStats,
    book: renderBook,
    mastery: countMastered,
    fx: FX,
    snd: SND
  };
})();

</script>
</body>
</html>
